[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill3d"
version = "0.1.0"
description = "Skill3D: 自演进 3D 空间感知 VLM 智能体（在线 Qwen3-VL-8B + 离线 GPT-6 治理）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
    "numpy",
    "scipy",
    "opencv-python>=4.8.0",
    "scikit-image",
    "open3d",
    "trimesh",
    "pyarrow",
    "pandas",
    "datasets",
    "jinja2",
    "lancedb",
    "structlog",
    "hydra-core",
    "mlflow",
    "hypothesis",
    "docker",
    "transitions",
    "openai>=1.12.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
