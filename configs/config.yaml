# 主配置（系统架构.md §2 / §13.5）
# mode=online 走在线推理链（M1-M13，绝对无 GPT-6）
# mode=offline_evolution 走离线演进链（M14-M21）
mode: online  # online | offline_evolution

seed: 0

paths:
  data_root: data
  vsi_bench_meta: data/vsi_bench_meta
  # 本机实测可用（2026-09-18）：288/288 scene 全覆盖，布局 <root>/<dataset>/<scene>.mp4
  raw_videos: /nas/wangjh/Skill-3D/dataset/VSI-Bench
  reconstructions: data/reconstructions
  trace_store: data/traces
  memory_db: data/memory_lancedb
  skill_registry: data/skill_registry
  active_snapshot: data/active_snapshot.json

frame_sampling:
  n_frames: 32                          # 与 VSI-Bench 官方开源模型对齐
  strategy: uniform

vllm:
  model: Qwen/Qwen3-VL-8B-Instruct-FP8  # 实测：BF16(17GB) 与共用卡时 OOM，主线用官方 FP8（9.9GB）
  quantization: none                    # FP8 自带量化；社区 AWQ 需 --quantization awq 且用 FP8 交叉验证
  max_model_len: 32768
  gpu_memory_utilization: 0.90
  # 32 帧输入（§1.2 / §4 M1）；实测 32 帧 @max_pixels=131072 → ~9703 prompt tokens
  n_frames: 32
  max_pixels: 131072
  tensor_parallel_size: 1               # DP×8 不 TP（ADR-2）
  dp_world_size: 8
  base_port: 8100
  temperature: 0.0                      # greedy，保证同 seed 字节级一致

sandbox:
  image: skill3d-sandbox:latest
  network: none
  read_only: true
  cpus: 4
  memory: 8g
  pids_limit: 256
  cell_timeout_s: 120                   # TODO_CALIBRATE
  max_regenerate: 3                     # AST 失败有限重生成 TODO_CALIBRATE

# M5 检测兜底：本地开放词表检测器（GroundingDINO 服务；确定性 Tool，非 LLM）
# 规程：VLM 给对象名+bbox 提示为正解；VLM 定位失败时用本检测器兜底，避免对象类 Tool
# 被整场景收回。留空 = 不启用兜底。
detection:
  endpoint: http://127.0.0.1:20022     # TODO_USER_INPUT：检测器服务地址（组内服务）
  box_threshold: 0.25                  # TODO_CALIBRATE

# v4/v5 的 `scale` 段（冻结 conformal 校准器、标定池、逐题型授权校准）已按 v6 §20
# 整体废止：v6 放弃一切需要校准的米制尺度路线，改由 reconstruction/metric_fusion.py
# （零样本度量深度跨帧融合，§11）在推理期产出尺度。该路线的模型卡与阈值属
# [待实验]/[TODO_CALIBRATE]，PoC 通过前不登记任何默认值（不得给"兜底常量"）。

split_config: configs/vsi_bench_split.yaml
admission_thresholds: configs/admission_thresholds.yaml
