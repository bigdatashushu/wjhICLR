# harness3d v11 运行配置；在线求解与离线修订由各自入口驱动。

seed: 0

# v9 execution/evolution starting configuration. These values are recorded
# for reproducibility; real runtime wiring and calibration remain pending.
max_solver_rounds: 6
max_retries_per_operation: 3
finalization_rounds: 1

paths:
  data_root: data
  vsi_bench_meta: data/vsi_bench_meta
  # 本机实测可用（2026-09-18）：288/288 scene 全覆盖，布局 <root>/<dataset>/<scene>.mp4
  raw_videos: /nas/wangjh/Skill-3D/dataset/VSI-Bench
  # v9 §5.2"可重试加载"的来源副本（用户 2026-09-27 裁定：重试 = **换来源/换副本**）。
  # 主来源缺失/不可解码时，按序尝试这些备用根：<fb>/<dataset>/<scene>.mp4（目录式镜像）
  # 与 <fb>/<dataset>_<scene>.mp4（平铺式镜像）。本机 VSI_videos 是**部分**副本
  # （274 个文件，未覆盖全部 288 scene），因此只有主来源真的坏掉/缺失时才会用到它。
  # 用了副本的题会记进 RunManifest 的 source_retried_samples，且 video_id 带来源标签
  # （副本可能是另一种编码，禁止与主来源共用重建缓存）。
  raw_video_fallbacks:
    - /nas/wangjh/Skill-3D/dataset/VSI_videos
  reconstructions: data/reconstructions
  trace_store: data/traces
  # 每题型唯一 active Skill。
  skill_library: skill_library
  active_snapshot: skill_library/snapshots/active_snapshot.json

frame_sampling:
  n_frames: 32                          # 与 VSI-Bench 官方开源模型对齐
  strategy: uniform
# M2 质量诊断（模糊／曝光／对比度／运动）：v9 §5.1 要求**默认关闭**，
# 只在独立诊断实验中开启。默认 1.0 权重不影响主流程（scene_route 不再被 M2 权重左右）。
input_diagnostics: false

# v11 固定按题型查找唯一方法；只配置完整正文的服务长度上限。
retrieval:
  config_version: ret-v11-deterministic-1  # 人类标签；内容摘要由代码复算并落盘
  # §13.5"上下文放不下时先减少完整条目"的上限，同时是"超过服务限制的候选在静态
  # 检查中拒绝"的判据（单条正文超过它的候选永远无法完整交付）。
  # 依据：32 帧 @max_pixels=131072 ≈ 9.7k prompt tokens，max_model_len=32768，
  # 留出推理与程序输出余量后给方法上下文的预算。
  method_context_max_chars: 8000

# v9 §9.4 主动图像（inspect_frames / detect_objects）：图像布局必须**事先声明**。
# 服务实测：8100 的 vLLM 是 `--limit-mm-per-prompt {"image": 32}`，一个请求最多 32 张图
# （实测 33 张 → 400 "At most 32 image(s) may be provided in one prompt"）。
# 因此观察轮用声明布局 `derived_plus_originals_v1`：派生图（裁剪）优先占位，其余名额
# 按帧序补原帧；被省略的原帧已在更早请求里交付过，被省略的派生图保持 unobserved。
active_vision:
  layout: derived_plus_originals_v1
  max_derived_images: 8        # 单次请求里派生图的占位上限（服务上限内）

vllm:
  model: Qwen/Qwen3-VL-8B-Instruct-FP8  # 实测：BF16(17GB) 与共用卡时 OOM，主线用官方 FP8（9.9GB）
  quantization: none                    # FP8 自带量化；社区 AWQ 需 --quantization awq 且用 FP8 交叉验证
  max_model_len: 32768
  gpu_memory_utilization: 0.90
  # 32 帧输入（§1.2 / §4 M1）；实测 32 帧 @max_pixels=131072 → ~9703 prompt tokens
  n_frames: 32
  max_pixels: 131072
  tensor_parallel_size: 1               # DP×8 不 TP（ADR-2）
  dp_world_size: 8
  base_port: 8100
  temperature: 0.0                      # greedy，保证同 seed 字节级一致

sandbox:
  cell_timeout_s: 120                   # TODO_CALIBRATE
  max_regenerate: 3                     # AST 失败有限重生成 TODO_CALIBRATE

# M5 检测兜底：本地开放词表检测器（GroundingDINO 服务；确定性 Tool，非 LLM）
# 规程：VLM 给对象名+bbox 提示为正解；VLM 定位失败时用本检测器兜底，避免对象类 Tool
# 被整场景收回。留空 = 不启用兜底。
detection:
  endpoint: http://127.0.0.1:20022     # TODO_USER_INPUT：检测器服务地址（组内服务）
  box_threshold: 0.25                  # TODO_CALIBRATE

# v4/v5 的 `scale` 段（冻结 conformal 校准器、标定池、逐题型授权校准）已按 v6 §20
# 整体废止：v6 放弃一切需要校准的米制尺度路线，改由 reconstruction/metric_fusion.py
# （零样本度量深度跨帧融合，§11）在推理期产出尺度。该路线的模型卡与阈值属
# [待实验]/[TODO_CALIBRATE]，PoC 通过前不登记任何默认值（不得给"兜底常量"）。

split_config: configs/vsi_bench_split.yaml
