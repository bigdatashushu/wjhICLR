# Reproducible GPU bootstrap and v11 experiment defaults.
# CODE_REF must still be supplied to bootstrap_and_run_v11.sh because this file
# cannot predict the future commit that will contain itself.
code:
  repository: https://github.com/bigdatashushu/wjhICLR.git

environment:
  python: "3.11"
  min_free_disk_gib: 80
  min_gpu_count: 2
  min_gpu_memory_gib: 20
  vllm_version: "0.19.1"
  sam2_code_revision: 2b90b9f5ceec907a1c18123530e92e794ad901a4
  moge_code_revision: 74fbce054ebed49800de42d0ad0e83495065719a

weights:
  qwen:
    repo_id: Qwen/Qwen3-VL-8B-Instruct-FP8
    revision: 9cdc6310a8cb770ce18efaf4e9935334512aee45
    existing_path: /home/cvailab/.cache/huggingface/hub/models--Qwen--Qwen3-VL-8B-Instruct-FP8
  vggt:
    repo_id: facebook/VGGT-1B
    revision: 860abec7937da0a4c03c41d3c269c366e82abdf9
    existing_path: /home/cvailab/.cache/huggingface/geothinker/VGGT-1B
  sam2:
    repo_id: facebook/sam2.1-hiera-large
    revision: 227a114a2f535cd147f82442e7d2038cdd2e5d68
    existing_path: /home/cvailab/.cache/huggingface/hub/models--facebook--sam2.1-hiera-large/snapshots/227a114a2f535cd147f82442e7d2038cdd2e5d68
    checkpoint_file: sam2.1_hiera_large.pt
    config: configs/sam2.1/sam2.1_hiera_l.yaml
  moge2:
    enabled: false
    repo_id: Ruicheng/moge-2-vitl
    revision: 39c4d5e957afe587e04eec59dc2bcc3be5ecd968
    existing_path: ""

runtime:
  qwen_gpu: 0
  geometry_gpu: 1
  host: 127.0.0.1
  port: 8100
  served_model_name: qwen3vl-v11
  max_model_len: 32768
  gpu_memory_utilization: 0.90
  max_pixels: 131072
  n_images: 32
  startup_timeout_s: 900

experiment:
  # Formal mode never manufactures these prerequisites. The launcher fails if
  # license acknowledgement, real videos, or quality confirmation is absent.
  formal: true
  accept_model_licenses: false
  accept_vsi_bench_license: false
  video_root: ""
  quality_confirmation: ""
  detector_endpoint: ""
  question_type: object_rel_distance
  datasets: scannet,scannetpp
  seed: 137
  induction_limit: 12
  inner_limit: 8
  post_publish_limit: 4
  reconstruction_sampling_per_task: 24
  run_evolution: false
  campaign_id: v11-s03-gpu
  # Deliberately no final_test option. This launcher only touches induction and
  # inner_validation; independent final evaluation remains a separate action.
